<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — Recruitment Copilot</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <h1 class="page-title">Analytics</h1>
      <p class="page-subtitle">Insights across all processed candidates</p>

      <p id="analytics-loading" class="loading-text">Loading analytics…</p>

      <div id="analytics-content" class="grid grid-2" style="display:none;">
        <div class="card chart-card">
          <h2 class="card-title">Top Skills</h2>
          <canvas id="top-skills-chart" height="220"></canvas>
        </div>

        <div class="card chart-card">
          <h2 class="card-title">Education Distribution</h2>
          <canvas id="education-chart" height="220"></canvas>
        </div>

        <div class="card chart-card span-2">
          <h2 class="card-title">Experience Distribution</h2>
          <canvas id="experience-chart" height="180"></canvas>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/api.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
